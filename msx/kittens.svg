  <rect width="1280" height="720" fill="url(#sky)"/>

  <g opacity="0.9">
    <use xlink:href="#star" x="90" y="80"><animate attributeName="opacity" values="0.25;1;0.25" dur="3.1s" repeatCount="indefinite"/></use>
    <use xlink:href="#star" x="210" y="160"><animate attributeName="opacity" values="1;0.2;1" dur="4.4s" repeatCount="indefinite"/></use>
    <use xlink:href="#star" x="340" y="70"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.7s" repeatCount="indefinite"/></use>
    <use xlink:href="#star" x="470" y="190"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.8s" repeatCount="indefinite"/></use>
    <use xlink:href="#star" x="610" y="95"><animate attributeName="opacity" values="0.2;1;0.2" dur="5.2s" repeatCount="indefinite"/></use>
    <use xlink:href="#star" x="760" y="170"><animate attributeName="opacity" values="1;0.3;1" dur="3.3s" repeatCount="indefinite"/></use>
    <use xlink:href="#star" x="900" y="80"><animate attributeName="opacity" values="0.3;1;0.3" dur="4.1s" repeatCount="indefinite"/></use>
    <use xlink:href="#star" x="1040" y="180"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.9s" repeatCount="indefinite"/></use>
    <use xlink:href="#star" x="1180" y="110"><animate attributeName="opacity" values="0.2;1;0.2" dur="4.7s" repeatCount="indefinite"/></use>
    <use xlink:href="#star" x="150" y="300"><animate attributeName="opacity" values="0.7;0.1;0.7" dur="3.6s" repeatCount="indefinite"/></use>
    <use xlink:href="#star" x="1140" y="330"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="4.2s" repeatCount="indefinite"/></use>
    <use xlink:href="#star" x="660" y="280"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.5s" repeatCount="indefinite"/></use>
  </g>

  <circle cx="1010" cy="185" r="190" fill="url(#moonGlow)"/>
  <circle cx="1010" cy="185" r="78" fill="#f7f1cf"/>
  <circle cx="985" cy="160" r="13" fill="#e6dfba" opacity="0.55"/>
  <circle cx="1035" cy="205" r="9" fill="#e6dfba" opacity="0.5"/>
  <circle cx="1020" cy="150" r="6" fill="#e6dfba" opacity="0.45"/>

  <ellipse cx="640" cy="640" rx="560" ry="100" fill="url(#kittenGlow)"/>

  <g transform="translate(275,470)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -12;0 0" dur="4.2s" repeatCount="indefinite"/>
      <use xlink:href="#kittenOrange"/>
    </g>
  </g>

  <g transform="translate(640,530)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 10;0 0" dur="3.6s" repeatCount="indefinite"/>
      <use xlink:href="#kittenGrey" transform="scale(1.12)"/>
    </g>
  </g>

  <g transform="translate(1010,480)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -9;0 0" dur="4.8s" repeatCount="indefinite"/>
      <use xlink:href="#kittenWhite" transform="scale(0.94)"/>
    </g>
  </g>

  <g fill="#ffe9a8" opacity="0.65">
    <circle cx="430" cy="240" r="3"><animate attributeName="cy" values="240;215;240" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="855" cy="330" r="2.5"><animate attributeName="cy" values="330;300;330" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="420" r="2"><animate attributeName="cy" values="420;395;420" dur="5.5s" repeatCount="indefinite"/></circle>
  </g>
</svg>
