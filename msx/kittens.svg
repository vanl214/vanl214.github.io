        <animateTransform attributeName="transform" type="rotate" values="-5 40 54;12 40 54;-5 40 54" dur="2.9s" repeatCount="indefinite"/>
      </path>
      <circle cx="-30" cy="-8" r="13" fill="#f7f4ec"/>
      <circle cx="30" cy="-8" r="13" fill="#f7f4ec"/>
      <circle cx="-30" cy="-8" r="7" fill="#efb0ba"/>
      <circle cx="30" cy="-8" r="7" fill="#efb0ba"/>
      <circle cx="0" cy="6" r="40" fill="#f7f4ec"/>
      <ellipse cx="0" cy="22" rx="22" ry="15" fill="#ffffff"/>
      <ellipse cx="-15" cy="2" rx="5" ry="7" fill="#25314d"/>
      <ellipse cx="15" cy="2" rx="5" ry="7" fill="#25314d"/>
      <circle cx="-16" cy="0" r="1.8" fill="#ffffff"/>
      <circle cx="14" cy="0" r="1.8" fill="#ffffff"/>
      <path d="M-5 16 L5 16 L0 22 Z" fill="#e88fa0"/>
      <path d="M0 22 Q-8 30 -15 22 M0 22 Q8 30 15 22" fill="none" stroke="#25314d" stroke-width="2" stroke-linecap="round"/>
      <path d="M-22 20 L-42 16 M-22 24 L-43 25 M22 20 L42 16 M22 24 L43 25" stroke="#b9c6db" stroke-width="1.6" stroke-linecap="round" opacity="0.9"/>
