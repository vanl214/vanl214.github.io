    </g>
    <g id="kittenWhite">
      <ellipse cx="0" cy="46" rx="52" ry="42" fill="#f7f4ec"/>
      <ellipse cx="0" cy="58" rx="34" ry="26" fill="#ffffff" opacity="0.9"/>
