      <circle cx="30" cy="-8" r="13" fill="#b9c6db"/>
      <circle cx="-30" cy="-8" r="7" fill="#e8a7b7"/>
      <circle cx="30" cy="-8" r="7" fill="#e8a7b7"/>
      <circle cx="0" cy="6" r="40" fill="#b9c6db"/>
      <ellipse cx="0" cy="22" rx="22" ry="15" fill="#eef4ff"/>
      <ellipse cx="-15" cy="2" rx="5" ry="7" fill="#25314d"/>
      <ellipse cx="15" cy="2" rx="5" ry="7" fill="#25314d"/>
      <circle cx="-16" cy="0" r="1.8" fill="#ffffff"/>
      <circle cx="14" cy="0" r="1.8" fill="#ffffff"/>
