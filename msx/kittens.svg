<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050916"/>
      <stop offset="0.55" stop-color="#0b1633"/>
      <stop offset="1" stop-color="#152550"/>
    </linearGradient>
    <radialGradient id="moonGlow">
      <stop offset="0" stop-color="#fff4c9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff4c9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="kittenGlow">
      <stop offset="0" stop-color="#9fd8ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#9fd8ff" stop-opacity="0"/>
    </radialGradient>
    <g id="star">
      <circle r="2.4" fill="#fff3c4"/>
      <circle r="5.5" fill="#fff3c4" opacity="0.18"/>
    </g>
    <g id="kittenOrange">
      <ellipse cx="0" cy="46" rx="52" ry="42" fill="#f2a65a"/>
      <ellipse cx="0" cy="58" rx="34" ry="26" fill="#ffd9a8" opacity="0.85"/>
      <path d="M40 56 C86 52 92 10 66 4 C86 24 72 48 40 44 Z" fill="#f2a65a">
        <animateTransform attributeName="transform" type="rotate" values="-8 40 54;10 40 54;-8 40 54" dur="2.6s" repeatCount="indefinite"/>
      </path>
      <circle cx="-30" cy="-8" r="13" fill="#f2a65a"/>
      <circle cx="30" cy="-8" r="13" fill="#f2a65a"/>
      <circle cx="-30" cy="-8" r="7" fill="#e8899d"/>
      <circle cx="30" cy="-8" r="7" fill="#e8899d"/>
      <circle cx="0" cy="6" r="40" fill="#f2a65a"/>
      <ellipse cx="0" cy="22" rx="22" ry="15" fill="#ffd9a8"/>
      <ellipse cx="-15" cy="2" rx="5" ry="7" fill="#25314d"/>
      <ellipse cx="15" cy="2" rx="5" ry="7" fill="#25314d"/>
      <circle cx="-16" cy="0" r="1.8" fill="#ffffff"/>
      <circle cx="14" cy="0" r="1.8" fill="#ffffff"/>
      <path d="M-5 16 L5 16 L0 22 Z" fill="#e88fa0"/>
      <path d="M0 22 Q-8 30 -15 22 M0 22 Q8 30 15 22" fill="none" stroke="#25314d" stroke-width="2" stroke-linecap="round"/>
      <path d="M-22 20 L-42 16 M-22 24 L-43 25 M22 20 L42 16 M22 24 L43 25" stroke="#e8f1ff" stroke-width="1.6" stroke-linecap="round" opacity="0.8"/>
      <ellipse cx="-22" cy="42" rx="12" ry="8" fill="#f2a65a"/>
      <ellipse cx="22" cy="42" rx="12" ry="8" fill="#f2a65a"/>
    </g>
    <g id="kittenGrey">
      <ellipse cx="0" cy="46" rx="52" ry="42" fill="#b9c6db"/>
      <ellipse cx="0" cy="58" rx="34" ry="26" fill="#eef4ff" opacity="0.85"/>
